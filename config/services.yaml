# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Repository\CompetitionRepositoryInterface: '@App\Repository\CompetitionRepository'
    App\Repository\CompetitionPhaseRepositoryInterface: '@App\Repository\CompetitionPhaseRepository'
    App\Repository\CountryRepositoryInterface: '@App\Repository\CountryRepository'
    App\Repository\GameRepositoryInterface: '@App\Repository\GameRepository'
    App\Repository\PredictionRepositoryInterface: '@App\Repository\PredictionRepository'
    App\Repository\StadiumRepositoryInterface: '@App\Repository\StadiumRepository'
    App\Repository\StandingRepositoryInterface: '@App\Repository\StandingRepository'
    App\Repository\TeamRepositoryInterface: '@App\Repository\TeamRepository'
    App\Repository\UserRepositoryInterface: '@App\Repository\UserRepository'

    App\Service\CompetitionServiceInterface: '@App\Service\CompetitionService'
    App\Service\CompetitionPhaseServiceInterface: '@App\Service\CompetitionPhaseService'
    App\Service\CountryServiceInterface: '@App\Service\CountryService'
    App\Service\GameServiceInterface: '@App\Service\GameService'
    App\Service\PredictionServiceInterface: '@App\Service\PredictionService'
    App\Service\PredictionPointServiceInterface: '@App\Service\PredictionPointService'
    App\Service\RankingServiceInterface: '@App\Service\RankingService'
    App\Service\StadiumServiceInterface: '@App\Service\StadiumService'
    App\Service\StandingServiceInterface: '@App\Service\StandingService'
    App\Service\TeamServiceInterface: '@App\Service\TeamService'
